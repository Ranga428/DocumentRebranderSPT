[project]
name = "document-rebrander"
version = "1.0.0"
description = "Rebrand any document into the fixed SPT Word/PDF template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
